<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Don't Be Michael</title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob:; connect-src 'self' http[...]">
    <!-- Fonts are bundled (src/renderer/src/design/fonts.css), never fetched:
         Google's font hosts are blocked in mainland China. The splash uses
         the v2 tokens (branding/DESIGN.md 3) before the stylesheet loads. -->
    <style>
      #cth-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: #F7F7FB; color: #1E1B2E;
        font-family: "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        #cth-splash { background: #14131C; color: #ECEAF4; }
        #cth-splash .hint { color: #A5A2B8; }
      }
      /* Holds the mark's place until main.tsx swaps in the brand kit's Struck M. */
      #cth-splash .mk { width: 56px; height: 56px; }
      #cth-splash .title { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; }
      #cth-splash .hint { font-size: 13px; color: #6C6884; }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="cth-splash">
        <div class="mk" aria-hidden="true"></div>
        <div class="title">Don't Be Michael</div>
        <div class="hint" role="status" aria-live="polite">Opening the office…</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
